<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>リサーチ依頼文メーカー</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    background: #f4f6f9;
    color: #333;
    margin: 0;
    padding: 16px;
    line-height: 1.6;
  }
  .container {
    max-width: 780px;
    margin: 0 auto;
    background: #fff;
    padding: 24px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  }
  h1 {
    font-size: 1.4em;
    margin-top: 0;
    color: #2b4c7e;
    border-bottom: 2px solid #2b4c7e;
    padding-bottom: 8px;
  }
  .lead {
    background: #eef4fb;
    padding: 12px;
    border-radius: 8px;
    font-size: 0.9em;
    margin-bottom: 20px;
  }
  label {
    display: block;
    font-weight: bold;
    margin-top: 16px;
    margin-bottom: 6px;
    font-size: 0.95em;
  }
  .hint {
    font-size: 0.8em;
    color: #666;
    font-weight: normal;
    margin-left: 6px;
  }
  input[type="text"], textarea, select {
    width: 100%;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 1em;
    font-family: inherit;
  }
  textarea { resize: vertical; min-height: 60px; }
  .tab-buttons {
    display: flex;
    gap: 6px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .tab-buttons button {
    flex: 1;
    min-width: 100px;
    padding: 10px 6px;
    background: #e8ecf3;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.9em;
    font-weight: bold;
    color: #555;
  }
  .tab-buttons button.active {
    background: #2b4c7e;
    color: #fff;
  }
  .actions {
    margin-top: 20px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .actions button {
    flex: 1;
    min-width: 130px;
    padding: 12px;
    border: none;
    border-radius: 6px;
    font-size: 0.95em;
    cursor: pointer;
    font-weight: bold;
  }
  .btn-primary { background: #2b4c7e; color: #fff; }
  .btn-copy { background: #4caf50; color: #fff; }
  .btn-clear { background: #ddd; color: #333; }
  .output {
    margin-top: 20px;
    background: #f8f9fb;
    border: 1px solid #ddd;
    padding: 14px;
    border-radius: 8px;
    white-space: pre-wrap;
    font-size: 0.9em;
    min-height: 100px;
    word-break: break-word;
  }
  .msg {
    text-align: center;
    color: #4caf50;
    font-weight: bold;
    margin-top: 8px;
    min-height: 20px;
    font-size: 0.9em;
  }
  .saved-list {
    margin-top: 24px;
    border-top: 1px solid #eee;
    padding-top: 16px;
  }
  .saved-item {
    background: #fafafa;
    padding: 10px;
    border-radius: 6px;
    margin-bottom: 6px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    font-size: 0.9em;
  }
  .saved-item span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .saved-item button {
    padding: 6px 10px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 0.8em;
  }
  .btn-load { background: #2b4c7e; color: #fff; }
  .btn-del { background: #d9534f; color: #fff; }
</style>
</head>
<body>
<div class="container">
  <h1>リサーチ依頼文メーカー</h1>
  <div class="lead">
    調べもの・比較表・スライド原稿などをAIに任せるとき、「何を・どこまで・どんな形で」お願いすればいいか迷いませんか？<br>
    このアプリは、質問に答えるだけで<b>そのままAIに貼り付けられる依頼文</b>を作ります。作った文は保存もできます。
  </div>

  <label>やりたいこと</label>
  <div class="tab-buttons">
    <button data-type="research" class="active">情報を調べる</button>
    <button data-type="compare">比較表を作る</button>
    <button data-type="slide">スライド原稿を作る</button>
  </div>

  <div id="form"></div>

  <div class="actions">
    <button class="btn-primary" onclick="generate()">依頼文を作る</button>
    <button class="btn-copy" onclick="copyText()">コピー</button>
    <button class="btn-clear" onclick="saveCurrent()">保存</button>
  </div>
  <div class="msg" id="msg"></div>

  <label style="margin-top:20px;">できた依頼文（これをAIに貼るだけ）</label>
  <div class="output" id="output">ここに依頼文が表示されます。</div>

  <div class="saved-list">
    <label style="margin-top:0;">保存した依頼文</label>
    <div id="savedList"></div>
  </div>
</div>

<script>
const forms = {
  research: [
    {key:'topic', label:'調べたいテーマ', hint:'例：中小企業向けの経費精算ツール', type:'text'},
    {key:'purpose', label:'何のために調べる？', hint:'例：稟議書の裏付け資料にしたい', type:'text'},
    {key:'points', label:'特に知りたいポイント', hint:'例：料金、導入事例、サポート体制', type:'textarea'},
    {key:'level', label:'知識レベル', type:'select', options:['初心者向けにやさしく','ある程度知っている前提で','専門的に詳しく']}
  ],
  compare: [
    {key:'items', label:'比較したい対象', hint:'例：freee, マネーフォワード, 楽楽精算', type:'textarea'},
    {key:'axes', label:'比較したい項目', hint:'例：料金、機能、対応規模、無料期間', type:'textarea'},
    {key:'purpose', label:'何のために比較する？', hint:'例：自社に合うツールを選びたい', type:'text'},
    {key:'recommend', label:'おすすめも聞く？', type:'select', options:['はい、用途別におすすめを教えて','いいえ、表だけでいい']}
  ],
  slide: [
    {key:'theme', label:'スライドのテーマ', hint:'例：新入社員向けビジネスマナー研修', type:'text'},
    {key:'audience', label:'聞き手はだれ？', hint:'例：入社1年目の社員', type:'text'},
    {key:'pages', label:'ページ数', hint:'例：10', type:'text'},
    {key:'goal', label:'聞き終わったときにどうなってほしい？', hint:'例：明日から実践できる状態', type:'text'}
  ]
};

let currentType = 'research';

function renderForm() {
  const container = document.getElementById('form');
  container.innerHTML = '';
  forms[currentType].forEach(f => {
    const label = document.createElement('label');
    label.innerHTML = f.label + (f.hint ? '<span class="hint">'+f.hint+'</span>' : '');
    container.appendChild(label);
    let el;
    if (f.type === 'textarea') el = document.createElement('textarea');
    else if (f.type === 'select') {
      el = document.createElement('select');
      f.options.forEach(o => {
        const op = document.createElement('option');
        op.value = o; op.textContent = o;
        el.appendChild(op);
      });
    } else {
      el = document.createElement('input');
      el.type = 'text';
    }
    el.id = 'f_' + f.key;
    container.appendChild(el);
  });
}

document.querySelectorAll('.tab-buttons button').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.tab-buttons button').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    currentType = b.dataset.type;
    renderForm();
    document.getElementById('output').textContent = 'ここに依頼文が表示されます。';
  });
});

function getValues() {
  const v = {};
  forms[currentType].forEach(f => {
    v[f.key] = document.getElementById('f_' + f.key).value.trim();
  });
  return v;
}

function generate() {
  const v = getValues();
  let text = '';
  if (currentType === 'research') {
    text = `以下のテーマについて、信頼できる情報源を複数調べて、要点をまとめてください。

【調べたいテーマ】
${v.topic || '（未入力）'}

【目的】
${v.purpose || '（未入力）'}

【特に知りたいポイント】
${v.points || '（未入力）'}

【伝え方】
${v.level || '初心者向けにやさしく'}

【まとめ方の指定】
- 冒頭に「3行サマリー」を書いてください
- そのあとに、ポイントごとに見出しをつけて整理してください
- 最後に「注意点・見落としがちなポイント」を追加してください
- 情報源が古い可能性があれば明記してください`;
  } else if (currentType === 'compare') {
    text = `以下の対象を比較して、表形式でまとめてください。

【比較する対象】
${v.items || '（未入力）'}

【比較する項目】
${v.axes || '（未入力）'}

【比較の目的】
${v.purpose || '（未入力）'}

【出力の指定】
- まず比較表をマークダウンの表で作ってください
- 各項目のセルは短く、一目で違いがわかるようにしてください
- 表の下に、それぞれの「向いている人・向いていない人」を短くまとめてください
${v.recommend && v.recommend.startsWith('はい') ? '- 最後に、用途別のおすすめを理由つきで教えてください' : ''}
- 情報が不確かな箇所は「要確認」と書いてください`;
  } else {
    text = `以下の条件で、プレゼン用スライドの原稿（構成案）を作ってください。

【テーマ】
${v.theme || '（未入力）'}

【聞き手】
${v.audience || '（未入力）'}

【ページ数】
${v.pages || '10'} ページ

【聞き終わったあとのゴール】
${v.goal || '（未入力）'}

【出力の指定】
- 1ページごとに「ページ番号・タイトル・話す内容の要点（箇条書き3〜5個）・スピーカーノート」を出してください
- 最初のページはタイトルスライド、最後のページはまとめにしてください
- 専門用語には短い補足をつけてください
- 全体を通して、聞き手が飽きないように具体例を1つ以上入れてください`;
  }
  document.getElementById('output').textContent = text;
  showMsg('依頼文ができました。コピーしてAIに貼り付けてください。');
}

function copyText() {
  const t = document.getElementById('output').textContent;
  if (!t || t === 'ここに依頼文が表示されます。') { showMsg('先に「依頼文を作る」を押してください', true); return; }
  const ta = document.createElement('textarea');
  ta.value = t;
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); showMsg('コピーしました'); }
  catch(e) { showMsg('コピーに失敗しました', true); }
  document.body.removeChild(ta);
}

function showMsg(m, isErr) {
  const el = document.getElementById('msg');
  el.textContent = m;
  el.style.color = isErr ? '#d9534f' : '#4caf50';
  setTimeout(() => { el.textContent = ''; }, 2500);
}

function saveCurrent() {
  const t = document.getElementById('output').textContent;
  if (!t || t === 'ここに依頼文が表示されます。') { showMsg('先に「依頼文を作る」を押してください', true); return; }
  const title = prompt('保存名を入力してください', new Date().toLocaleString('ja-JP'));
  if (!title) return;
  const saved = JSON.parse(localStorage.getItem('rpm_saved') || '[]');
  saved.unshift({title, text:t, date:Date.now()});
  localStorage.setItem('rpm_saved', JSON.stringify(saved));
  renderSaved();
  showMsg('保存しました');
}

function renderSaved() {
  const saved = JSON.parse(localStorage.getItem('rpm_saved') || '[]');
  const list = document.getElementById('savedList');
  if (saved.length === 0) {
    list.innerHTML = '<div style="color:#999;font-size:0.9em;">保存された依頼文はまだありません。</div>';
    return;
  }
  list.innerHTML = '';
  saved.forEach((s, i) => {
    const div = document.createElement('div');
    div.className = 'saved-item';
    div.innerHTML = `<span>${escapeHtml(s.title)}</span>
      <button class="btn-load" onclick="loadSaved(${i})">開く</button>
      <button class="btn-del" onclick="delSaved(${i})">削除</button>`;
    list.appendChild(div);
  });
}

function loadSaved(i) {
  const saved = JSON.parse(localStorage.getItem('rpm_saved') || '[]');
  if (!saved[i]) return;
  document.getElementById('output').textContent = saved[i].text;
  showMsg('読み込みました');
  window.scrollTo({top: document.getElementById('output').offsetTop - 20, behavior:'smooth'});
}

function delSaved(i) {
  if (!confirm('削除しますか？')) return;
  const saved = JSON.parse(localStorage.getItem('rpm_saved') || '[]');
  saved.splice(i, 1);
  localStorage.setItem('rpm_saved', JSON.stringify(saved));
  renderSaved();
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}

renderForm();
renderSaved();
</script>
</body>
</html>
